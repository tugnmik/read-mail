services:
  - type: web
    name: read-mail
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /ping
    envVars:
      - key: PORT
        value: 10000
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /root/.cache/ms-playwright
      - key: WEB_CONCURRENCY
        value: 1
      - key: GUNICORN_THREADS
        value: 4
      - key: GUNICORN_TIMEOUT
        value: 900
      - key: OAUTH2_TARGET_WORKERS
        value: 2
      - key: OAUTH2_MIN_WORKERS
        value: 1
      - key: OAUTH2_MAX_RETRIES
        value: 2
      - key: OAUTH2_WORKER_STAGGER_SECONDS
        value: 1.0
